<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gig Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14213d">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1c1e;--mut:#6b6b70;--acc:#14213d;--hot:#c1121f;--ok:#2a9d8f;--line:#e4e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#101218;--card:#1a1d26;--ink:#ececf0;--mut:#9a9aa6;--acc:#e9c46a;--line:#2a2e3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0;font-size:20px}small,.mut{color:var(--mut)}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:14px}
.tabs button.on,.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
input[type=search]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
main{padding:12px 16px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card.done{opacity:.55}.card h3{margin:0 0 4px;font-size:16px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;margin:0 4px 4px 0;background:var(--line)}
.tag.new{background:var(--hot);color:#fff}.tag.demand{background:var(--ok);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns a,.btns button{border:0;border-radius:10px;padding:8px 12px;font-size:14px;background:var(--acc);color:var(--bg);text-decoration:none}
.btns .alt{background:var(--line);color:var(--ink)}
details{margin-top:8px}textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.grp{margin:14px 0 6px;font-weight:600}.links a{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--card);font-size:14px}
#status{font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🎹🎻 Gig Finder <small id="where"></small></h1>
  <div id="status" class="mut">Loading…</div>
  <div class="tabs"><button id="t-offers" class="on">Offers</button><button id="t-links">Search live</button><button id="t-set">Message</button></div>
  <div id="fbar">
    <input type="search" id="q" placeholder="Search offers…">
    <div class="filters">
      <button class="chip" id="f-new">New</button>
      <button class="chip on" id="f-demand">Hide musicians' ads</button>
      <button class="chip" id="f-hide">Hide dismissed</button>
      <button class="chip" id="f-ref" style="margin-left:auto">↻ Refresh</button>
    </div>
  </div>
</header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
