name: gigfinder-hourly
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node gigfinder/src/run.js
        env: { NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}' }
      - run: |
          git config user.name gigfinder-bot && git config user.email bot@users.noreply.github.com
          git add gigfinder/web/data/offers.json
          git diff --cached --quiet || (git commit -m "gigfinder: update offers" && git push)
